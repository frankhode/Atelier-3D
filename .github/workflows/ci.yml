name: Verificar Atelier 3D
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Instalar navegador de pruebas
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verificar el render WebGL
        run: npm run test:render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pictorial-render-checks
          path: artifacts
          retention-days: 7
